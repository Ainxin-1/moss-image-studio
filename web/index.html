    [/^(\d+)\s+selected$/i, (m) => "已选择 " + m[1] + " 项"],
    [/^(\d+)\s+files?$/i, (m) => m[1] + " 个文件"],
    [/^(\d+)\s+images?$/i, (m) => m[1] + " 张图片"],
    [/^([\d.]+)\s*s$/i, (m) => m[1] + " 秒"]
  ];
  const ATTRS = ["placeholder", "title", "aria-label"];
  const SKIP = new Set(["SCRIPT", "STYLE", "NOSCRIPT", "TEXTAREA"]);
  const STORE_KEY = "sdcpp-ui-lang";
  const TITLE_EN = document.title;
  const TITLE_ZH = "stable-diffusion.cpp 网页界面";
  let lang = "zh";
  try { if (localStorage.getItem(STORE_KEY) === "en") lang = "en"; } catch (e) {}

  const textOrig = new WeakMap();
  const attrOrig = new WeakMap();

  function lookup(raw) {
    const key = raw.trim();
    if (!key) return null;
    if (Object.prototype.hasOwnProperty.call(DICT, key)) return DICT[key];
    const lower = LOWER[key.toLowerCase()];
    if (lower !== undefined) return lower;
    for (let i = 0; i < PATTERNS.length; i++) {
      const m = key.match(PATTERNS[i][0]);
      if (m) return PATTERNS[i][1](m);
    }
    return null;
  }
  function keepSpace(src, out) {
    const lead = src.match(/^\s*/)[0];
    const trail = src.match(/\s*$/)[0];
    return lead + out + trail;
  }
  function applyText(node) {
    if (!node || node.nodeType !== 3) return;
    const parent = node.parentElement;
    if (!parent || SKIP.has(parent.tagName)) return;
    const cur = node.nodeValue;
    let prev = textOrig.get(node);
    if (lang === "en") {
      if (prev !== undefined && cur !== prev) node.nodeValue = prev;
      return;
    }
    if (prev === undefined) {
      prev = cur;
    } else {
      const prevZh = lookup(prev);
      if (prevZh !== null && cur === keepSpace(prev, prevZh)) return;
      if (cur !== prev) prev = cur;
    }
    textOrig.set(node, prev);
    const zh = lookup(prev);
    if (zh !== null) node.nodeValue = keepSpace(prev, zh);
  }
  function applyAttr(el) {
    if (!el || !el.getAttribute) return;
    for (let i = 0; i < ATTRS.length; i++) {
      const name = ATTRS[i];
      const cur = el.getAttribute(name);
      if (cur === null) continue;
      let map = attrOrig.get(el);
      if (!map) { map = Object.create(null); attrOrig.set(el, map); }
      if (map[name] === undefined) {
        map[name] = cur;
      } else if (cur !== map[name]) {
        const prevZh = lookup(map[name]);
        if (!(prevZh !== null && cur === keepSpace(map[name], prevZh))) map[name] = cur;
      }
      const src = map[name];
      if (lang === "zh") {
        const zh = lookup(src);
        if (zh !== null && cur !== keepSpace(src, zh)) el.setAttribute(name, keepSpace(src, zh));
      } else if (cur !== src) {
        el.setAttribute(name, src);
      }
    }
  }
  function walk(root) {
    if (!root) return;
    if (root.nodeType === 3) { applyText(root); return; }
    if (root.nodeType !== 1 && root.nodeType !== 9) return;
    if (root.nodeType === 1) applyAttr(root);
    const tw = document.createTreeWalker(root, NodeFilter.SHOW_TEXT | NodeFilter.SHOW_ELEMENT);
    let n = tw.nextNode();
    while (n) {
      if (n.nodeType === 3) applyText(n); else applyAttr(n);
      n = tw.nextNode();
    }
  }

  const observer = new MutationObserver((muts) => {
    for (let i = 0; i < muts.length; i++) {
      const m = muts[i];
      if (m.type === "characterData") applyText(m.target);
      else if (m.type === "attributes") applyAttr(m.target);
      else if (m.type === "childList") {
        for (let j = 0; j < m.addedNodes.length; j++) walk(m.addedNodes[j]);
      }
    }
  });

  const bar = document.createElement("div");
  bar.id = "sdcpp-lang-switch";
  bar.style.cssText = "position:fixed;right:14px;bottom:14px;z-index:2147483647;display:flex;gap:4px;padding:4px;border-radius:999px;background:rgba(17,24,39,.92);box-shadow:0 6px 18px rgba(0,0,0,.35);font:12px/1 'Microsoft YaHei UI',system-ui,sans-serif;user-select:none";
  function makeBtn(code, label) {
    const b = document.createElement("button");
    b.type = "button";
    b.textContent = label;
    b.dataset.lang = code;
    b.style.cssText = "border:0;border-radius:999px;padding:7px 13px;cursor:pointer;background:transparent;color:#cbd5e1;font:inherit";
    b.addEventListener("click", () => setLang(code));
    return b;
  }
  const zhBtn = makeBtn("zh", "中文");
  const enBtn = makeBtn("en", "English");
  bar.append(zhBtn, enBtn);

  function paint() {
    [zhBtn, enBtn].forEach((b) => {
      const on = b.dataset.lang === lang;
      b.style.background = on ? "#10b981" : "transparent";
      b.style.color = on ? "#04221a" : "#cbd5e1";
      b.style.fontWeight = on ? "700" : "500";
    });
    bar.title = lang === "zh" ? "切换界面语言" : "Switch interface language";
  }
  function setLang(code) {
    lang = code === "en" ? "en" : "zh";
    try { localStorage.setItem(STORE_KEY, lang); } catch (e) {}
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = lang === "zh" ? TITLE_ZH : TITLE_EN;
    paint();
    walk(document.body);
  }

  function start() {
    document.body.appendChild(bar);
    document.documentElement.lang = lang === "zh" ? "zh-CN" : "en";
    document.title = lang === "zh" ? TITLE_ZH : TITLE_EN;
    paint();
    walk(document.body);
    observer.observe(document.documentElement, {
      subtree: true,
      childList: true,
      characterData: true,
      attributes: true,
      attributeFilter: ATTRS
    });
  }
  start();
})();
</script>
</body>
</html>
